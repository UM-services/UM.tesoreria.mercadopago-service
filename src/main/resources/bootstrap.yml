app:
  port: ${APP_PORT:8080}
  logging: DEBUG
  name: tesoreria-mercadopago-service
  access-token: access-token
  notification-url: notification-url
  secret-key: secret-key
  renovacion:
    enabled: ${APP_RENOVACION_ENABLED:true}
    cron: "${APP_RENOVACION_CRON:0 30 0 * * *}"
    zone: ${APP_RENOVACION_ZONE:America/Argentina/Mendoza}
    lookback-dias: ${APP_RENOVACION_LOOKBACK_DIAS:3}
    page-size: ${APP_RENOVACION_PAGE_SIZE:200}
    max-fallidos-detalle: ${APP_RENOVACION_MAX_FALLIDOS:50}
  checking:
    legacy-scheduler:
      enabled: ${APP_CHECKING_LEGACY_ENABLED:false}
  webhook:
    # Solo para entornos de prueba: con credenciales de testeo Mercado Pago firma con otro secret
    # y la validación nunca pasa. false = modo permisivo (procesa igual y deja traza informativa).
    signature-validation: ${APP_WEBHOOK_SIGNATURE_VALIDATION:true}
    # Fallback IPN legacy (?id=<paymentId>&topic=payment). Apagado por defecto: habilitarlo sólo en
    # entornos controlados y con los consumidores idempotentes ya desplegados.
    legacy-ipn-enabled: ${APP_WEBHOOK_LEGACY_IPN_ENABLED:false}
  consul:
    host: consul-service
    port: 8500
  swagger:
    username: ${APP_SWAGGER_USERNAME:tesoreria}
    password: ${APP_SWAGGER_PASSWORD:tesoreria}

server:
  port: ${app.port}

spring:
  application:
    name: ${app.name}
  cloud:
    consul:
      host: ${app.consul.host}
      port: ${app.consul.port}
      discovery:
        prefer-ip-address: true
        # Solo resolver instancias con los checks en passing (Feign/LoadBalancer).
        query-passing: true
        # Consul: readiness (sin dependencias) + poda si queda critico.
        health-check-path: /actuator/health/readiness
        health-check-critical-timeout: 5m
        tags: tesoreria,mercadopago
  kafka:
    bootstrap-servers: kafka:9092

logging:
  level:
    um.tesoreria.mercadopago: ${app.logging}
    web: ${app.logging}
    org:
      springframework.cloud.config: ${app.logging}

management:
  endpoints:
    web:
      exposure:
        include: health,scheduledtasks,env
  endpoint:
    health:
      show-details: always
